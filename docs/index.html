<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="/daily-reading/" />
<title>每日阅读 · 英语学习文章与音频</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#ffffff; --ink:#1a1a1a; --muted:#9aa0a6;
    --line:#e3e6ea; --accent:#2b7a4b; --accent-soft:#e8f3ec;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",
      "Helvetica Neue",Arial,sans-serif; line-height:1.65;
  }
  .wrap{max-width:860px; margin:0 auto; padding:24px 16px 64px}
  header h1{font-size:22px; margin:0 0 2px}
  header .sub{color:var(--muted); font-size:14px; margin:0 0 18px}
  #toggleCal{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line); background:#fff; border-radius:10px;
    padding:7px 13px; font-size:14px; color:var(--ink); cursor:pointer; margin-bottom:12px
  }
  #toggleCal:hover{background:var(--accent-soft); border-color:var(--accent)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.04)}
  /* 周条 */
  .dow{display:grid; grid-template-columns:repeat(7,30px); gap:4px; justify-content:center; margin-bottom:6px}
  .dow span{text-align:center; font-size:11px; color:var(--muted)}
  .strip{display:flex; gap:14px; overflow-x:auto; padding:2px 1px 6px; scroll-behavior:smooth; -webkit-overflow-scrolling:touch}
  .strip::-webkit-scrollbar{height:6px}
  .strip::-webkit-scrollbar-thumb{background:#d7dbe0; border-radius:3px}
  .week{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:4px}
  .wklabel{font-size:10px; color:var(--muted); white-space:nowrap}
  .wkrow{display:flex; gap:4px}
  .wday{
    width:30px; height:30px; border-radius:8px; font-size:12px;
    display:flex; align-items:center; justify-content:center; user-select:none
  }
  .wday.other{visibility:hidden}
  .wday.none{color:#cfd3d8; background:#fafbfc}
  .wday.has{color:var(--ink); background:#fff; border:1px solid var(--line); cursor:pointer}
  .wday.has:hover{background:var(--accent-soft); border-color:var(--accent)}
  .wday.today{outline:2px solid var(--accent); outline-offset:-2px}
  .wday.sel{background:var(--accent)!important; color:#fff!important; border-color:var(--accent)!important}
  .hint{font-size:11px; color:var(--muted); text-align:center; margin-top:4px}
  /* 内容 */
  #subtitle{font-size:15px; color:var(--muted); margin:6px 2px 8px}
  #content{margin-top:8px}
  #content h1{font-size:21px; margin:6px 0 14px}
  #content h2{font-size:17px; margin:22px 0 8px; color:#333}
  #content p{margin:0 0 12px}
  #content audio{width:100%; margin:10px 0 16px}
  #content .ph{color:var(--muted)}
  .legend{display:flex; gap:16px; font-size:12px; color:var(--muted); margin:8px 2px 0; justify-content:center}
  .legend i{display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px; margin-right:4px}
  .legend .b{background:#fff; border:1px solid var(--line)}
  .legend .g{background:#fafbfc; border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>每日阅读</h1>
    <p class="sub">英语学习文章与朗读音频 · 按日期回看</p>
  </header>

  <button id="toggleCal">选择日期 ▾</button>
  <div id="calCard" class="card" style="display:none">
    <div class="dow"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div id="cal" class="strip"></div>
    <div class="hint">← 滑动查看其它周 →</div>
    <div class="legend">
      <span><i class="b"></i>有记录</span>
      <span><i class="g"></i>无记录</span>
    </div>
  </div>

  <div id="subtitle"></div>
  <div id="content"></div>
</div>

<script>
const avail = new Set();
let articles = [];
let curY, curM, selectedDate = null;
const cal = document.getElementById('cal');
const calCard = document.getElementById('calCard');
const toggleCal = document.getElementById('toggleCal');
let calVisible = false;
const pad = n => (n < 10 ? '0' + n : '' + n);
const fmt = dt => dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate());

function updateToggle(){
  toggleCal.textContent = calVisible ? '收起日期 ▴' : '选择日期 ▾';
  calCard.style.display = calVisible ? 'block' : 'none';
}
toggleCal.onclick = () => {
  calVisible = !calVisible; updateToggle();
  if(calVisible) scrollToCurrentWeek();
};

// 周一为一周起点
function weekStart(d){
  const day = d.getDay(); // 0=Sun
  const diff = (day === 0) ? -6 : (1 - day);
  const s = new Date(d); s.setDate(d.getDate() + diff);
  s.setHours(0,0,0,0);
  return s;
}
function addWeeks(d, n){ const r = new Date(d); r.setDate(r.getDate() + 7*n); return r; }

const WEEK_BEFORE = 12, WEEK_AFTER = 6;

function renderCal(){
  const today = new Date();
  const todayStr = fmt(today);
  const base = weekStart(today);
  let w = addWeeks(base, -WEEK_BEFORE);
  const end = addWeeks(base, WEEK_AFTER);
  let html = '';
  while(w <= end){
    const label = (w.getMonth()+1) + '/' + w.getDate();
    let row = '<div class="wkrow">';
    for(let i=0;i<7;i++){
      const dd = new Date(w); dd.setDate(w.getDate() + i);
      const ds = fmt(dd);
      const cls = ['wday'];
      if(!avail.has(ds)) cls.push('none'); else cls.push('has');
      if(ds === todayStr) cls.push('today');
      if(ds === selectedDate) cls.push('sel');
      const attr = avail.has(ds) ? ' data-date="'+ds+'"' : '';
      row += '<div class="'+cls.join(' ')+'"'+attr+'>'+dd.getDate()+'</div>';
    }
    row += '</div>';
    html += '<div class="week" data-ws="'+fmt(w)+'"><div class="wklabel">'+label+'</div>'+row+'</div>';
    w = addWeeks(w, 1);
  }
  cal.innerHTML = html;
}

function scrollToCurrentWeek(){
  const ws = fmt(weekStart(new Date()));
  const el = cal.querySelector('.week[data-ws="'+ws+'"]');
  if(el) el.scrollIntoView({inline:'center', block:'nearest'});
}

cal.addEventListener('click', e=>{
  const t = e.target.closest('.wday.has');
  if(t && t.dataset.date) loadArticle(t.dataset.date);
});

async function loadArticle(date){
  selectedDate = date;
  renderCal();
  const a = articles.find(x => x.date === date);
  const meta = a ? (' · 新学 ' + a.new + ' / 复习 ' + a.review) : '';
  document.getElementById('subtitle').textContent = date + meta;
  try{
    const res = await fetch('articles/' + date + '.html');
    if(!res.ok) throw new Error('not found');
    document.getElementById('content').innerHTML = await res.text();
    location.hash = date;
  }catch(err){
    document.getElementById('content').innerHTML = '<p class="ph">加载失败：' + date + '</p>';
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

function showPlaceholder(){
  document.getElementById('subtitle').textContent = '';
  document.getElementById('content').innerHTML =
    '<p class="ph">今日文章尚未生成。点「选择日期」展开周历，滑动查看黑色有记录日期。</p>';
}

async function init(){
  try{
    const res = await fetch('dates.json');
    const data = await res.json();
    articles = data.articles || [];
    articles.forEach(a => avail.add(a.date));
  }catch(err){
    document.getElementById('content').innerHTML = '<p class="ph">清单加载失败（dates.json）。</p>';
    return;
  }
  const now = new Date();
  curY = now.getFullYear(); curM = now.getMonth();
  let target = null;
  const hash = location.hash.replace('#','');
  if(hash && avail.has(hash)) target = hash;
  else if(avail.has(fmt(now))) target = fmt(now);
  else if(articles.length) target = articles[0].date;
  renderCal();
  updateToggle();
  if(target) loadArticle(target); else showPlaceholder();
}
init();
</script>
</body>
</html>
